<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/images/wayzza-icon.png" />
  <link rel="apple-touch-icon" href="/images/logo-light.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Viewport: FIX #122: removed maximum-scale and user-scalable which breaks pinch-zoom accessibility -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Theme -->
  <meta name="theme-color" content="#0a2618" />
  <meta name="msapplication-TileColor" content="#0a2618" />

  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wayzza" />

  <!-- Primary Meta Tags -->
  <title>Wayzza — Luxury Clifftop Villas & Royal Enfield Rentals in Varkala</title>
  <meta name="title" content="Wayzza — Luxury Clifftop Villas & Royal Enfield Rentals in Varkala" />
  <meta name="description"
    content="Access a verified collection of clifftop villas, high-performance rentals, and hidden local secrets in Varkala. Curated sanctuaries & elite mobility for the modern explorer." />
  <meta name="keywords"
    content="Wayzza, Wayzza Varkala, Varkala luxury stays, clifftop villas Varkala, Royal Enfield rentals Varkala, premium car rentals Kerala, curated Varkala experiences" />
  <meta name="author" content="Wayzza" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://wayzza.live" />
  <meta property="og:title" content="Wayzza — Luxury Clifftop Villas & Royal Enfield Rentals in Varkala" />
  <meta property="og:description"
    content="Discover verified clifftop villas, luxury rentals, and hidden local secrets in Varkala. Wayzza curates premium sanctuaries for the modern explorer." />
  <meta property="og:image" content="https://wayzza.live/images/varkala_hero.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Wayzza" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://wayzza.live/" />
  <meta name="twitter:title" content="Wayzza — Luxury Clifftop Villas & Royal Enfield Rentals in Varkala" />
  <meta name="twitter:description" content="Verified clifftop villas and luxury rentals in Varkala. Curated for the modern explorer." />
  <meta name="twitter:image" content="https://wayzza.live/images/varkala_hero.png" />

  <!-- NOTE: Canonical is set per-page by react-helmet-async (SEO component).
       A static canonical here would wrongly apply '/' to ALL SPA routes,
       causing Google to treat /listings, /experiences etc. as homepage duplicates. -->

  <!-- Critical Resource Preloads -->
  <link rel="preload" href="/favicon.svg" as="image" />
  <!-- LCP hero image: preloaded before JS parses so browser fetches it instantly -->
  <link rel="preload" href="/images/varkala_hero.webp" as="image" type="image/webp" />

  <!-- Preconnect to origins used for dynamic content (API + image CDN) -->
  <link rel="preconnect" href="https://api.wayzza.live" crossorigin />
  <link rel="dns-prefetch" href="https://api.wayzza.live" />
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
  <link rel="dns-prefetch" href="https://res.cloudinary.com" />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Google Fonts: Inter — loaded non-blocking with display=swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- Structured Data (JSON-LD) — Static shell schema for crawlers before JS executes -->
  <script type="application/ld+json">
  [
    {
      "@context": "https://schema.org",
      "@type": ["LocalBusiness", "LodgingBusiness", "TravelAgency"],
      "@id": "https://wayzza.live/#organization",
      "name": "Wayzza",
      "alternateName": "Wayzza Varkala",
      "description": "Wayzza is Varkala's premier luxury travel brand — verified clifftop villas, Royal Enfield motorcycle rentals, premium car hire, and curated boutique experiences on the Kerala coast.",
      "url": "https://wayzza.live",
      "logo": "https://wayzza.live/favicon.svg",
      "image": "https://wayzza.live/images/varkala_hero.webp",
      "telephone": "+91 80892 22444",
      "email": "stay@wayzza.live",
      "priceRange": "\u20b9\u20b9\u20b9",
      "currenciesAccepted": "INR, USD, EUR, GBP",
      "paymentAccepted": "Cash, Credit Card, UPI, Net Banking",
      "foundingDate": "2024",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Varkala North Cliff",
        "addressLocality": "Varkala",
        "addressRegion": "Kerala",
        "postalCode": "695141",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 8.7379,
        "longitude": 76.7163
      },
      "openingHoursSpecification": [{
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
        "opens": "00:00",
        "closes": "23:59"
      }],
      "areaServed": [
        {"@type": "City", "name": "Varkala"},
        {"@type": "State", "name": "Kerala"}
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Wayzza Services",
        "itemListElement": [
          {"@type": "OfferCatalog", "name": "Luxury Clifftop Villas", "description": "Verified premium ocean-view villas on the Varkala Cliff."},
          {"@type": "OfferCatalog", "name": "Royal Enfield Rentals", "description": "Classic 350, Thunderbird, and Himalayan available for daily hire in Varkala."},
          {"@type": "OfferCatalog", "name": "Luxury Car Rentals", "description": "Chauffeur and self-drive luxury vehicles including airport transfers from TRV."},
          {"@type": "OfferCatalog", "name": "Curated Experiences", "description": "Ayurveda, cliff yoga, sunset cruises, Kathakali, and seafood masterclasses."}
        ]
      },
      "sameAs": [
        "https://www.instagram.com/wayzza.live",
        "https://www.twitter.com/wayzza",
        "https://www.facebook.com/wayzza"
      ]
    },
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://wayzza.live/#website",
      "name": "Wayzza",
      "url": "https://wayzza.live",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://wayzza.live/listings?location={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  ]
  </script>
</head>

<body style="margin:0;font-family:system-ui">

      </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
